name: ci-windows-release

# Trigger: same semantics as ci-systemd-release
#   - Any tag push
#   - Manual dispatch with required tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag which has to be updated"
        type: string
        required: true
  push:
    tags:
      - "*"

permissions: read-all

jobs:
  build-and-release:
    name: Build and release Windows artifacts
    if: github.repository == 'Aryan-sharma11/kubearmor'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      # Validate semver tag before doing any real work (mirrors ci-systemd-release)
      - name: Validate version
        id: validate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const Regex = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;
            const version = '${{ github.event_name }}' === 'push'
              ? '${{ github.ref_name }}'
              : '${{ inputs.tag }}';
            if (!Regex.test(version)) {
              core.setFailed(`Invalid version format: ${version}`);
            } else {
              core.setOutput('release_tag', version);
            }

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Prepare tag and checkout ref
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ steps.validate.outputs.release_tag }}"
          Write-Host "Release tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            git checkout $tag
          }

      # ---- Driver build (WDK + MSBuild) ----

      # MSG00001.bin is generated by mc.exe (Message Compiler) from KarmorLogs.man.
      # MSBuild runs mc.exe but outputs to the OBJ dir; KarmorLogs.rc expects
      # MSG00001.bin relative to the source directory, so we run it manually first.
      - name: Run Message Compiler (mc.exe)
        shell: pwsh
        working-directory: pkg/KubeArmorWindowsDriver
        run: |
          $mcExe = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter "mc.exe" `
            | Where-Object { $_.FullName -match "x64" } `
            | Select-Object -First 1 -ExpandProperty FullName

          if (-not $mcExe) { Write-Error "mc.exe not found"; exit 1 }

          Write-Host "Using mc.exe: $mcExe"
          & $mcExe KarmorLogs.man

          if (-not (Test-Path "MSG00001.bin")) {
            Write-Error "MSG00001.bin was not generated"
            exit 1
          }
          Write-Host "MSG00001.bin generated successfully"

      - name: Build driver — Release x64
        shell: pwsh
        working-directory: pkg/KubeArmorWindowsDriver
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" `
            kubearmor.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:InfVerif_Enable=false `
            /m `
            /v:minimal

      # ---- Go binary build (.exe) ----

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "KubeArmor/go.mod"

      - name: Build kubearmor.exe — amd64
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.tag.outputs.tag }}
        working-directory: KubeArmor
        run: |
          New-Item -ItemType Directory -Path ..\windows-binaries -Force | Out-Null

          Write-Host "Building GOOS=windows GOARCH=amd64 ..."
          $env:GOOS   = "windows"
          $env:GOARCH = "amd64"
          go build `
            -tags windows `
            "-ldflags=-s -w -X main.version=$env:VERSION" `
            -o "..\windows-binaries\kubearmor-windows-amd64.exe" `
            .

      # ---- WiX MSI Installer Build ----

      - name: Build WiX MSI Installer
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.tag }}"
          $root     = "${{ github.workspace }}"

          # ── Pre-flight: resolve and validate every artifact path ──────────────
          $srcExe      = "$root\windows-binaries\kubearmor-windows-amd64.exe"
          $driverDir   = "$root\pkg\KubeArmorWindowsDriver\x64\Release"
          $driverSys   = "$driverDir\kubearmor.sys"
          $driverInf   = "$driverDir\kubearmor.inf"

          Write-Host "=== Pre-flight artifact check ==="
          Write-Host "  EXE  : $srcExe"
          Write-Host "  SYS  : $driverSys"
          Write-Host "  INF  : $driverInf"

          @($srcExe, $driverSys, $driverInf) | ForEach-Object {
            if (-not (Test-Path $_)) {
              Write-Error "Required artifact missing: $_"
              exit 1
            }
            Write-Host "  [OK] $_"
          }

          # ── 1. Stage driver files ─────────────────────────────────────────────
          $driverPkgDir = "$driverDir\kubearmor"
          New-Item -ItemType Directory -Path $driverPkgDir -Force | Out-Null
          Copy-Item $driverSys "$driverPkgDir\kubearmor.sys" -Force
          Copy-Item $driverInf "$driverPkgDir\kubearmor.inf" -Force
          $catSrc = "$driverDir\kubearmor.cat"
          if (Test-Path $catSrc) {
            Copy-Item $catSrc "$driverPkgDir\kubearmor.cat" -Force
          } else {
            New-Item -ItemType File -Path "$driverPkgDir\kubearmor.cat" -Force | Out-Null
          }

          # ── 2. Clean stale bin/obj ────────────────────────────────────────────
          Remove-Item -Recurse -Force "$root\pkg\KubeArmorDriverInstaller\bin" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$root\pkg\KubeArmorDriverInstaller\obj" -ErrorAction SilentlyContinue

          # ── 3. Build WiX installer ────────────────────────────────────────────
          # Set env var so WiX candle picks it up via $(env.KubeArmorExePath) in Product.wxs.
          # Environment variables are inherited by child processes (candle.exe / light.exe).
          $env:KubeArmorExePath = $srcExe
          Write-Host "=== Starting WiX MSBuild ==="
          Write-Host "  KubeArmorExePath = $env:KubeArmorExePath"

          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" `
            "$root\pkg\KubeArmorDriverInstaller\KubeArmorDriverInstaller.wixproj" `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:InfVerif_Enable=false `
            /m `
            /v:normal

          if ($LASTEXITCODE -ne 0) {
            Write-Error "WiX MSBuild failed with exit code $LASTEXITCODE"
            exit 1
          }

          # ── 4. Copy generated MSI to dist ─────────────────────────────────────
          New-Item -ItemType Directory -Path "$root\dist" -Force | Out-Null
          $msiPath = Get-ChildItem "$root\pkg\KubeArmorDriverInstaller\bin" -Recurse -Filter "*.msi" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $msiPath) {
            Write-Error "MSI installer was not generated"
            exit 1
          }

          $msiDest = "$root\dist\kubearmor_${version}_Windows_x86_64.msi"
          Copy-Item $msiPath $msiDest
          Write-Host "Created $msiDest"

      # ---- Package into release zip & calculate checksums ----
      # Naming matches goreleaser convention: kubearmor_<version>_Windows_<arch>.zip

      - name: Create release archives
        id: archive
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          $version = $env:VERSION
          $driverBase = "pkg\KubeArmorWindowsDriver"
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          $name = "kubearmor_${version}_Windows_x86_64"
          $dir  = "dist\$name"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          Copy-Item "windows-binaries\kubearmor-windows-amd64.exe"        "$dir\kubearmor.exe"
          Copy-Item "$driverBase\x64\Release\kubearmor.sys"               "$dir\kubearmor.sys"
          Copy-Item "$driverBase\x64\Release\kubearmor.inf"               "$dir\kubearmor.inf"
          if (Test-Path "$driverBase\x64\Release\kubearmor.cat") {
            Copy-Item "$driverBase\x64\Release\kubearmor.cat"             "$dir\kubearmor.cat"
          }
          Copy-Item "LICENSE"                                              "$dir\LICENSE"

          Compress-Archive -Path "$dir\*" -DestinationPath "dist\${name}.zip"
          Write-Host "Created dist\${name}.zip"

          # SHA-256 checksums for both .zip and .msi
          Get-ChildItem dist\*.zip, dist\*.msi | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append "dist\sha256sums-windows.txt"
          }
          Get-Content "dist\sha256sums-windows.txt"

      # ---- Attach to GitHub Release ----
      # Wait for goreleaser (Linux job) to create the release first.

      - name: Upload Windows assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.tag.outputs.tag }}"

          # Wait for goreleaser (ci-systemd-release) to create the release.
          # Both workflows fire on the same tag push; the Windows build takes
          # longer, so the release should exist by the time we get here.
          for ($i = 1; $i -le 10; $i++) {
            gh release view $version --repo "${{ github.repository }}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $version found."
              break
            }
            Write-Host "Waiting for release $version ... ($i/10)"
            Start-Sleep -Seconds 30
          }

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release $version was not found after 5 minutes. Aborting."
            exit 1
          }

          $assets = (Get-ChildItem dist\*.zip, dist\*.msi, dist\sha256sums-windows.txt).FullName
          gh release upload $version @assets `
            --repo "${{ github.repository }}" `
            --clobber
