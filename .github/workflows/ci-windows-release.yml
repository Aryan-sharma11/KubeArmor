name: ci-windows-release

# Trigger: same semantics as ci-systemd-release
#   - Any tag push
#   - Manual dispatch with required tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag which has to be updated"
        type: string
        required: true
  push:
    tags:
      - "*"

permissions: read-all

jobs:
  build-and-release:
    name: Build and release Windows artifacts
    if: github.repository == 'Aryan-sharma11/kubearmor'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      # Validate semver tag before doing any real work (mirrors ci-systemd-release)
      - name: Validate version
        id: validate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const Regex = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;
            const version = '${{ github.event_name }}' === 'push'
              ? '${{ github.ref_name }}'
              : '${{ inputs.tag }}';
            if (!Regex.test(version)) {
              core.setFailed(`Invalid version format: ${version}`);
            } else {
              core.setOutput('release_tag', version);
            }

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Prepare tag and checkout ref
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ steps.validate.outputs.release_tag }}"
          Write-Host "Release tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            git checkout $tag
          }

      # ---- Install ARM64 WDK cross-compilation support ----
      # The windows-2022 runner has VS 2022 + WDK but without the ARM64
      # kernel import libraries. We add them via the VS installer modify command.
      # This installs: VC ARM64 compiler + ARM64 SDK headers/libs for driver dev.
      - name: Install ARM64 WDK components
        shell: pwsh
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          Write-Host "Adding ARM64 build tools via VS installer..."
          $proc = Start-Process -FilePath $vsInstaller -ArgumentList @(
            "modify",
            "--installPath", "C:\Program Files\Microsoft Visual Studio\2022\Enterprise",
            "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64",
            "--add", "Microsoft.VisualStudio.Component.VC.Redist.MSM",
            "--quiet",
            "--norestart",
            "--noUpdateInstaller"
          ) -Wait -PassThru

          if ($proc.ExitCode -ne 0) {
            Write-Warning "VS installer exited with code $($proc.ExitCode) — ARM64 tools may already be installed, continuing."
          } else {
            Write-Host "ARM64 build tools installed successfully."
          }

      # ---- Driver build (WDK + MSBuild) ----

      # MSG00001.bin is generated by mc.exe (Message Compiler) from KarmorLogs.man.
      # MSBuild runs mc.exe but outputs to the OBJ dir; KarmorLogs.rc expects
      # MSG00001.bin relative to the source directory, so we run it manually first.
      - name: Run Message Compiler (mc.exe)
        shell: pwsh
        working-directory: pkg/KubeArmorWindowsDriver
        run: |
          $mcExe = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter "mc.exe" `
            | Where-Object { $_.FullName -match "x64" } `
            | Select-Object -First 1 -ExpandProperty FullName

          if (-not $mcExe) { Write-Error "mc.exe not found"; exit 1 }

          Write-Host "Using mc.exe: $mcExe"
          & $mcExe KarmorLogs.man

          if (-not (Test-Path "MSG00001.bin")) {
            Write-Error "MSG00001.bin was not generated"
            exit 1
          }
          Write-Host "MSG00001.bin generated successfully"

      - name: Build driver — Release x64
        shell: pwsh
        working-directory: pkg/KubeArmorWindowsDriver
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" `
            kubearmor.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:InfVerif_Enable=false `
            /m `
            /v:minimal

      - name: Build driver — Release ARM64
        shell: pwsh
        working-directory: pkg/KubeArmorWindowsDriver
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" `
            kubearmor.sln `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:InfVerif_Enable=false `
            /m `
            /v:minimal

      # ---- Go binary build (.exe) ----

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "KubeArmor/go.mod"

      - name: Build kubearmor.exe — amd64 + arm64
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.tag.outputs.tag }}
        working-directory: KubeArmor
        run: |
          New-Item -ItemType Directory -Path ..\windows-binaries -Force | Out-Null

          foreach ($arch in @("amd64", "arm64")) {
            Write-Host "Building GOOS=windows GOARCH=$arch ..."
            $env:GOOS   = "windows"
            $env:GOARCH = $arch
            go build `
              -tags windows `
              "-ldflags=-s -w -X main.version=$env:VERSION" `
              -o "..\windows-binaries\kubearmor-windows-$arch.exe" `
              .\cmd\kubearmor
          }

      # ---- Package into release zips ----
      # Naming matches goreleaser convention: kubearmor_<version>_Windows_<arch>.zip

      - name: Create release archives
        id: archive
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          $version = $env:VERSION
          $driverBase = "pkg\KubeArmorWindowsDriver"
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          $archs = @(
            @{ GoArch = "amd64"; ArchiveSuffix = "x86_64"; SysArch = "x64"  },
            @{ GoArch = "arm64"; ArchiveSuffix = "arm64";  SysArch = "ARM64" }
          )

          foreach ($a in $archs) {
            $name = "kubearmor_${version}_Windows_$($a.ArchiveSuffix)"
            $dir  = "dist\$name"
            New-Item -ItemType Directory -Path $dir -Force | Out-Null

            # Daemon binary
            Copy-Item "windows-binaries\kubearmor-windows-$($a.GoArch).exe" "$dir\kubearmor.exe"

            # Minifilter driver
            $sysPath = "$driverBase\$($a.SysArch)\Release\kubearmor.sys"
            $infPath = "$driverBase\$($a.SysArch)\Release\kubearmor.inf"
            $catPath = "$driverBase\$($a.SysArch)\Release\kubearmor.cat"

            if (Test-Path $sysPath) { Copy-Item $sysPath "$dir\kubearmor.sys" }
            if (Test-Path $infPath) { Copy-Item $infPath "$dir\kubearmor.inf" }
            if (Test-Path $catPath) { Copy-Item $catPath "$dir\kubearmor.cat" }

            Compress-Archive -Path "$dir\*" -DestinationPath "dist\${name}.zip"
            Write-Host "Created dist\${name}.zip"
          }

          # SHA-256 checksums
          Get-ChildItem dist\*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append "dist\sha256sums-windows.txt"
          }
          Get-Content "dist\sha256sums-windows.txt"

      # ---- Attach to GitHub Release ----
      # Wait for goreleaser (Linux job) to create the release first.

      - name: Upload Windows assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          $version = "${{ steps.tag.outputs.tag }}"

          for ($i = 1; $i -le 10; $i++) {
            gh release view $version --repo "${{ github.repository }}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $version found."
              break
            }
            Write-Host "Waiting for release $version ... ($i/10)"
            Start-Sleep -Seconds 30
          }

          $assets = (Get-ChildItem dist\*.zip, dist\sha256sums-windows.txt).FullName
          gh release upload $version @assets `
            --repo "${{ github.repository }}" `
            --clobber
